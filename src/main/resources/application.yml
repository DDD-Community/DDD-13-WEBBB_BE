spring:
  profiles:
    active: local

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
          max-tokens: 200
    chat:
      observations:
        include-prompt: false
        include-completion: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_EXPIRY:1800000}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  ai:
    prompt-version: ${PROMPT_VERSION:v1}
    timeout: ${AI_TIMEOUT:20s}

resilience4j:
  retry:
    retry-aspect-order: 2
    instances:
      openAiProvider:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - com.ddd.webbb.ai.domain.exception.RetryableAiException
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      openAiProvider:
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.ddd.webbb.ai.domain.exception.RetryableAiException
        ignore-exceptions:
          - com.ddd.webbb.ai.domain.exception.PermanentAiException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        ai.emotion.analyze.duration: true

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
