name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: '배포 방식 선택'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - release_tag
      release_tag:
        description: '배포할 릴리즈 태그 (예: v1.3.0)'
        required: false
        type: string
      skip_tests:
        description: '테스트 건너뛰기 (긴급 배포 시 사용)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: webbb-ec2-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and determine image tag
        run: |
          deploy_mode="${{ inputs.deploy_mode }}"
          release_tag="${{ inputs.release_tag }}"

          if [ "$deploy_mode" = "release_tag" ]; then
            if [ -z "$release_tag" ]; then
              echo "release_tag is required when deploy_mode=release_tag"
              exit 1
            fi

            if ! printf '%s' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "release_tag must match v<major>.<minor>.<patch>"
              exit 1
            fi

            echo "IMAGE_TAG=$release_tag" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        if: ${{ inputs.deploy_mode == 'latest' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: ${{ inputs.deploy_mode == 'latest' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: ${{ inputs.deploy_mode == 'latest' }}
        run: chmod +x gradlew

      - name: Run tests
        if: ${{ inputs.deploy_mode == 'latest' && !inputs.skip_tests }}
        run: ./gradlew test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ inputs.deploy_mode == 'latest' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/app

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            export GITHUB_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            export KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}"
            export KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}"
            export NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}"
            export NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}"
            export FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"

            cd ~/app
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for application to start..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Application is healthy!"
                exit 0
              fi
              sleep 5
            done

            echo "ERROR: Health check failed after 150 seconds."
            docker compose -f docker-compose.prod.yml logs app --tail 50
            docker compose -f docker-compose.prod.yml stop app
            exit 1
